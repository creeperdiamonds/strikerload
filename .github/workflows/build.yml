name: Build

on:
  push:
    branches: [main]
    tags: ['v*', 'FAB-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Fails the build if anything that could constitute a backdoor appears in
  # source. This is the check the original plugin never had.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for privilege-escalation and network APIs
        run: |
          set -uo pipefail
          PATTERNS=(
            'setOp'                      # granting operator status
            'addAttachment'              # granting permissions at runtime
            'dispatchCommand'            # executing commands as another sender
            'performCommand'
            'HttpClient'                 # outbound network
            'HttpURLConnection'
            'URLConnection'
            'java\.net\.Socket'
            'Runtime\.getRuntime'        # process execution
            'ProcessBuilder'
            'Class\.forName'             # dynamic loading
            'defineClass'
            'setAccessible'              # reflection into internals
            'Base64'                     # commonly used to hide payloads
            'javax\.script'
          )
          FAIL=0
          for p in "${PATTERNS[@]}"; do
            if grep -rInE "$p" --include='*.java' strikerload-core/src strikerload-paper/src strikerload-fabric/src; then
              echo "::error::Forbidden API matched: $p"
              FAIL=1
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "Audit failed. If a match is legitimate, justify it in SECURITY.md"
            echo "and add a narrow exclusion here - do not widen the pattern."
            exit 1
          fi
          echo "Audit clean."

      - name: Verify core has no platform imports
        run: |
          if grep -rInE 'import (org\.bukkit|net\.minecraft|net\.fabricmc|net\.kyori|net\.md_5)' strikerload-core/src; then
            echo "::error::strikerload-core must stay platform-independent."
            echo "Platform types belong in strikerload-paper or strikerload-fabric."
            exit 1
          fi
          echo "Core is clean."

      - name: Verify AGPL headers present
        run: |
          MISSING=0
          for f in $(find . -name '*.java' -not -path './target/*'); do
            grep -q 'SPDX-License-Identifier: AGPL-3.0-or-later' "$f" || { echo "Missing header: $f"; MISSING=1; }
          done
          [ "$MISSING" -eq 0 ] || exit 1

  build:
    needs: audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: mc26_2
            jdk: '25'
            label: '26.2'
          - profile: mc26_1
            jdk: '25'
            label: '26.1.x'
          - profile: mc1_21_11
            jdk: '21'
            label: '1.21.11'
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven

      - name: Package
        run: mvn -B --no-transfer-progress clean package -P ${{ matrix.profile }}

      # maven-shade renames the pre-shade jar to original-<name>.jar and puts
      # the shaded one in its place. The original- jars do NOT contain
      # strikerload-core and would throw NoClassDefFoundError at runtime, so
      # every glob below is anchored to StrikerLoad-* to exclude them.
      - name: Checksum
        run: |
          cd strikerload-paper/target
          for j in StrikerLoad-*.jar; do
            sha256sum "$j" | tee "$j.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: StrikerLoad-${{ matrix.label }}
          path: |
            strikerload-paper/target/StrikerLoad-*.jar
            strikerload-paper/target/*.sha256


  # Fabric is a separate Gradle build, not a Maven profile, because Loom is
  # Gradle-only. One shared source tree, three toolchains: 1.21.11 is the last
  # obfuscated generation and needs fabric-loom-remap plus Mojang mappings on
  # Java 21, while 26.x ships deobfuscated and uses plain fabric-loom on Java 25.
  build-fabric:
    needs: audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mc26.2
            jdk: '25'
            label: 'fabric-26.2'
          - target: mc26.1
            jdk: '25'
            label: 'fabric-26.1.x'
          - target: mc1.21.11
            jdk: '21'
            label: 'fabric-1.21.11'
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: gradle

      - name: Package
        working-directory: strikerload-fabric
        run: ./gradlew --no-daemon --console=plain :${{ matrix.target }}:build

      - name: Checksum
        working-directory: strikerload-fabric/targets/${{ matrix.target }}/build/libs
        run: |
          for j in StrikerLoad-Fabric-*.jar; do
            sha256sum "$j" | tee "$j.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: StrikerLoad-${{ matrix.label }}
          path: |
            strikerload-fabric/targets/${{ matrix.target }}/build/libs/StrikerLoad-Fabric-*.jar
            strikerload-fabric/targets/${{ matrix.target }}/build/libs/*.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-fabric]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect checksums
        run: |
          find dist -name '*.sha256' -exec cat {} \; | sort > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/StrikerLoad-*.jar
            SHA256SUMS.txt
          body: |
            ## Which jar do I download?

            Pick by **server software** first, then by **Minecraft version**.

            ### Paper / Purpur / Folia - goes in `plugins/`

            | Your server version | Download the jar ending in |
            |---|---|
            | Minecraft 26.2 | `StrikerLoad-...-mc26.2.jar` |
            | Minecraft 26.1.x | `StrikerLoad-...-mc26.1.jar` |
            | Minecraft 1.21.11 and below | `StrikerLoad-...-mc1.21.11.jar` |

            ### Fabric - goes in `mods/`, and needs Fabric API

            | Your server version | Download the jar ending in |
            |---|---|
            | Minecraft 26.2 | `StrikerLoad-Fabric-...+mc26.2.jar` |
            | Minecraft 26.1.x | `StrikerLoad-Fabric-...+mc26.1.2.jar` |
            | Minecraft 1.21.11 | `StrikerLoad-Fabric-...+mc1.21.11.jar` |

            The `-Fabric-` ones are mods and will do nothing in a `plugins/`
            folder; the plain ones are plugins and will do nothing in `mods/`.

            There is one jar per Minecraft generation and they are **not**
            interchangeable. Installing the wrong one fails at startup with
            `Unsupported API version` in the console, or
            `UnsupportedClassVersionError` on a Java 21 server, and it never
            loads. Check the suffix against the table before restarting.

            Fabric builds are server-side only and gate on vanilla operator
            level rather than the plugin's `strikerload.use.*` permission
            nodes - see strikerload-fabric/README.md.

            ---

            Built by GitHub Actions from ${{ github.sha }}.

            Verify what you downloaded matches what was built from this source:

            ```
            sha256sum -c SHA256SUMS.txt
            ```

            Build log: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Licensed AGPL-3.0-or-later.

  # A FAB-* tag publishes only the Fabric jars, on its own version line.
  # A v* tag still goes through `release` above, which globs StrikerLoad-*.jar
  # and therefore publishes both platforms together.
  release-fabric:
    if: startsWith(github.ref, 'refs/tags/FAB-')
    needs: build-fabric
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: StrikerLoad-fabric-*
          path: dist

      - name: Collect checksums
        run: |
          find dist -name '*.sha256' -exec cat {} \; | sort > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/StrikerLoad-Fabric-*.jar
            SHA256SUMS.txt
          body: |
            Fabric build of StrikerLoad. Needs Fabric API.

            Works on dedicated servers, in **single-player**, and on a LAN
            host. Other players do not need the mod - everything it spawns is
            vanilla, so unmodified clients can join and see it all.

            ## Which jar do I download?

            | Your server version | Download the jar ending in |
            |---|---|
            | Minecraft 26.2 | `+mc26.2.jar` |
            | Minecraft 26.1.x | `+mc26.1.2.jar` |
            | Minecraft 1.21.11 | `+mc1.21.11.jar` |

            These go in `mods/`, not `plugins/`. There is one jar per
            Minecraft generation and they are **not** interchangeable.

            Playing single-player? Load the world with **Allow Cheats on** -
            that is the only way to reach `/strikerload give`, and without it
            there is no way to get a payload item.

            Two things that differ from the Paper plugin: permissions gate on
            vanilla **operator level** rather than the plugin's
            `strikerload.use.*` nodes, and config is JSON at
            `config/strikerload.json`. Both are covered in
            `strikerload-fabric/README.md`.

            Built by GitHub Actions from ${{ github.sha }}.

            Verify what you downloaded matches what was built from this source:

            ```
            sha256sum -c SHA256SUMS.txt
            ```

            Build log: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Licensed AGPL-3.0-or-later.
